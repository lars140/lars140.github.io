<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request a Stringly password reset." />
    <title>Reset password | Stringly</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="simple-page">
      <section class="simple-card" aria-labelledby="resetHeading">
        <a class="brand" href="/" aria-label="Return to Stringly login">
          <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M12 6v18.4a5 5 0 1 1-2-4V9l16-3v15.4a5 5 0 1 1-2-4V10L12 12"/></svg></span><span>Stringly</span>
        </a>
        <div class="auth-heading">
          <p class="kicker">Password recovery</p>
          <h1 id="resetHeading">Reset your password</h1>
          <p>Enter your email and we’ll send reset instructions if an account exists.</p>
        </div>
        <div id="resetAlert" class="form-alert" role="alert" hidden></div>
        <form id="resetForm" novalidate>
          <div class="field">
            <label for="resetEmail">Email address</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
              <input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="resetEmailError" required />
            </div>
            <p class="field-error" id="resetEmailError"></p>
          </div>
          <button class="primary-button" type="submit"><span class="button-label">Send reset instructions</span><span class="spinner" aria-hidden="true"></span></button>
        </form>
        <p class="signup"><a href="/">Back to log in</a></p>
      </section>
    </main>
    <script>
      const form = document.querySelector('#resetForm');
      const email = document.querySelector('#resetEmail');
      const error = document.querySelector('#resetEmailError');
      const alert = document.querySelector('#resetAlert');
      const button = form.querySelector('button');
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); error.textContent = ''; alert.hidden = true;
        if (!email.validity.valid) { error.textContent = 'Enter a valid email address.'; email.focus(); return; }
        button.disabled = true; button.classList.add('is-loading');
        try {
          const response = await fetch('/api/password-reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.value.trim() }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || 'Unable to send instructions.');
          alert.classList.add('form-alert--success'); alert.textContent = result.message; alert.hidden = false;
        } catch (requestError) { alert.textContent = requestError.message || 'Unable to send instructions. Please try again.'; alert.hidden = false; }
        finally { button.disabled = false; button.classList.remove('is-loading'); }
      });
    </script>
  </body>
</html>
